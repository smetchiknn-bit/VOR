<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор ВОР — ведомость объёмов работ</title>
    <meta
      name="description"
      content="Автоматическое формирование Ведомости объёмов работ: привязка кодов КЕР и ТМЦ к спецификации, тройная детализация, экспорт в ВОР.xlsx"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Критические стили: страница никогда не остаётся пустой/чёрной —
         фирменная заставка видна с первого кадра, пока грузится модуль. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      body {
        background: #eef1f0;
        color: #0e1823;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background:
          linear-gradient(rgba(27, 63, 158, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(27, 63, 158, 0.06) 1px, transparent 1px),
          #eef1f0;
        background-size: 24px 24px, 24px 24px, auto;
      }
      #boot .mark {
        font-family: "Unbounded", "IBM Plex Sans", sans-serif;
        font-weight: 900;
        font-size: 38px;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        line-height: 1;
      }
      #boot .mark b {
        color: #d18f0a;
      }
      #boot .bar {
        width: 190px;
        height: 3px;
        background: #dfe5e4;
        overflow: hidden;
        position: relative;
      }
      #boot .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: #f0a81c;
        transform-origin: left;
        animation: bootbar 1.15s ease-in-out infinite;
      }
      @keyframes bootbar {
        0% {
          transform: scaleX(0);
          transform-origin: left;
        }
        55% {
          transform: scaleX(1);
          transform-origin: left;
        }
        56% {
          transform-origin: right;
        }
        100% {
          transform: scaleX(0);
          transform-origin: right;
        }
      }
      #boot .cap {
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #55708a;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Загрузка приложения">
        <div class="mark">ВОР<b>·</b>ГЕН</div>
        <div class="bar"></div>
        <div class="cap">загрузка модулей…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор ВОР — ведомость объёмов работ</title>
    <meta
      name="description"
      content="Автоматическое формирование Ведомости объёмов работ: привязка кодов КЕР и ТМЦ к спецификации, тройная детализация, экспорт в ВОР.xlsx"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #eef1f0;
      }
    </style>
    <script>
      // Авто-починка путей сборки. Если приложение открыто не из корня домена
      // (подкаталог предпросмотра, отдельное окно и т. п.), абсолютные пути
      // /assets/… не разрешатся, и модуль не исполнится. Тогда — после загрузки
      // страницы — модуль и стили подгружаются повторно, относительными путями.
      (function () {
        window.__VOR_APP_MOUNTED__ = false;
        function rel(u) {
          return u.indexOf("/") === 0 ? "." + u : u;
        }
        function relaunch() {
          if (window.__VOR_APP_MOUNTED__ || window.__VOR_RELAUNCHED__) return;
          window.__VOR_RELAUNCHED__ = true;
          try {
            document
              .querySelectorAll('link[rel="stylesheet"][href^="/"]')
              .forEach(function (l) {
                var n = document.createElement("link");
                n.rel = "stylesheet";
                n.href = rel(l.getAttribute("href"));
                document.head.appendChild(n);
              });
          } catch (e) {
            /* стили — не критично */
          }
          var ms = document.querySelector('script[type="module"][src^="/"]');
          if (ms) {
            import(rel(ms.getAttribute("src"))).catch(function (err) {
              var d = document.createElement("div");
              d.style.cssText =
                "font-family:monospace;padding:24px;margin:16px;color:#b23c3a;background:#f8e2e1;border:1px solid #c6403e";
              d.textContent =
                "Не удалось загрузить модуль приложения: " +
                (err && err.message ? err.message : String(err));
              document.body.appendChild(d);
            });
          }
        }
        window.addEventListener("load", function () {
          setTimeout(relaunch, 400);
        });
        setTimeout(relaunch, 4000); // страховка, если событие load задержится
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

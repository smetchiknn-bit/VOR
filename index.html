<!doctype html>

    <title>Генератор ВОР — ведомость объёмов работ</title>
    <meta
      name="description"
      content="Автоматическое формирование Ведомости объёмов работ: привязка кодов КЕР и ТМЦ к спецификации, тройная детализация, экспорт в ВОР.xlsx"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #eef1f0;
        min-height: 100%;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          linear-gradient(rgba(27, 63, 158, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(27, 63, 158, 0.06) 1px, transparent 1px),
          #f4f6f5;
        background-size: 24px 24px, 24px 24px, auto;
        font-family: "Unbounded", "IBM Plex Sans", sans-serif;
      }
      #boot .mark {
        font-size: clamp(20px, 4vw, 38px);
        font-weight: 900;
        letter-spacing: 0.04em;
        color: #0e1823;
      }
      #boot .mark b {
        color: #d18f0a;
      }
      #boot .bar {
        width: min(300px, 62vw);
        height: 4px;
        background: rgba(14, 24, 35, 0.12);
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 36%;
        background: #f0a81c;
        animation: bootbar 1.1s ease-in-out infinite alternate;
      }
      @keyframes bootbar {
        from {
          transform: translateX(-30%);
        }
        to {
          transform: translateX(210%);
        }
      }
      #boot .cap {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #55708a;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Загрузка приложения">
        <div class="mark">ГЕНЕРАТОР<b>·</b>ВОР</div>
        <div class="bar"><i></i></div>
        <div class="cap">загрузка модулей…</div>
      </div>
    </div>
    <title>Генератор ВОР — Ведомость объёмов работ</title>

    />

  </body>
